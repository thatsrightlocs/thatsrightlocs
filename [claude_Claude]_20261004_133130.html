<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>That's Right, LOC'S™ — Coming Back Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Tenor+Sans&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --deep-brown: #1a0f0a;
      --cream: #faf6f0;
      --warm-brown: #8b4a3c;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--deep-brown);
      color: var(--cream);
      font-family: 'Tenor Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .logo-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      color: var(--gold);
      margin-bottom: 0.4rem;
    }
    .tagline {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--gold-light);
      letter-spacing: 0.1em;
      margin-bottom: 3rem;
      opacity: 0.85;
    }
    .divider {
      color: var(--gold);
      font-size: 1.2rem;
      letter-spacing: 1rem;
      margin-bottom: 3rem;
      opacity: 0.5;
    }
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2.2rem, 8vw, 4rem);
      font-weight: 400;
      line-height: 1.15;
      margin-bottom: 1.2rem;
      color: var(--cream);
    }
    h1 span { color: var(--gold); }
    p {
      font-size: 1rem;
      color: var(--gold-light);
      opacity: 0.8;
      max-width: 360px;
      line-height: 1.7;
      margin-bottom: 3rem;
    }
    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
    }
    .contact-links a {
      color: var(--gold);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      border-bottom: 1px solid rgba(201,168,76,0.3);
      padding-bottom: 2px;
      transition: color 0.2s, border-color 0.2s;
    }
    .contact-links a:hover { color: var(--gold-light); border-color: var(--gold-light); }
    .footer-note {
      margin-top: 4rem;
      font-size: 0.8rem;
      color: var(--gold);
      opacity: 0.35;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="logo-text">That's Right, LOC'S™</div>
  <div class="tagline">Expert Loc Care · Victorville, CA</div>
  <div class="divider">✦ ✦ ✦</div>
  <h1>We'll Be Back<br/><span>Very Soon</span></h1>
  <p>We're making some updates to serve you even better. Check back shortly — something beautiful is coming.</p>
  <div class="contact-links">
    <a href="tel:+17602610847">📞 Call or Text to Book</a>
    <a href="https://www.instagram.com/thatsrightlocs" target="_blank">📸 Follow Us on Instagram</a>
    <a href="mailto:thatsrightlocs@gmail.com">✉️ thatsrightlocs@gmail.com</a>
  </div>
  <div class="footer-note">Returning Shortly</div>
</body>
</html>
